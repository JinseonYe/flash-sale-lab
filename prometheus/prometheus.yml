global:
  scrape_interval: 5s

scrape_configs:
  - job_name: 'flash-sale-api'
    static_configs:
      - targets:
          - 'host.docker.internal:3000'

  - job_name: 'flash-sale-health'
    scrape_interval: 10s
    scrape_timeout: 8s

    metrics_path: /probe

    params:
      module: [http_2xx]

    static_configs:
      - targets:
          - 'http://host.docker.internal:3000/health'

    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target

      - source_labels: [__param_target]
        target_label: instance

      - target_label: __address__
        replacement: 'blackbox-exporter:9115'

  - job_name: 'rabbitmq'
    scrape_interval: 5s

    static_configs:
      - targets:
          - 'rabbitmq:15692'

  - job_name: 'rabbitmq-queues'
    scrape_interval: 5s

    metrics_path: /metrics/detailed

    params:
      family:
        - queue_coarse_metrics
        - queue_consumer_count

    static_configs:
      - targets:
          - 'rabbitmq:15692'
