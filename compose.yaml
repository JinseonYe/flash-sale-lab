services:
  postgresql:
    image: postgres:17
    container_name: flash-sale-postgres

    environment:
      POSTGRES_DB: flash_sale
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: fs1234

    ports:
      - '5432:5432'

    volumes:
      - postgres:/var/lib/postgresql/data

    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d flash_sale']
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  redis:
    image: redis:8
    container_name: flash-sale-redis

    ports:
      - '6379:6379'

    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  nginx:
    image: nginx:alpine
    container_name: flash-sale-nginx

    ports:
      - '8080:80'

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  postgres:
