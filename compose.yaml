services:
  postgresql:
    image: postgres:17
    container_name: flash-sale-postgres

    environment:
      POSTGRES_DB: flash_sale
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: fs1234

    ports:
      - '5432:5432'

    volumes:
      - postgres:/var/lib/postgresql/data

    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d flash_sale']
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  redis:
    image: redis:8
    container_name: flash-sale-redis

    ports:
      - '6379:6379'

    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  nginx:
    image: nginx:alpine
    container_name: flash-sale-nginx

    ports:
      - '8080:80'

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

  rabbitmq:
    image: rabbitmq:4-management
    container_name: flash-sale-rabbitmq

    ports:
      - '5672:5672'
      - '15672:15672'

    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  prometheus:
    image: prom/prometheus
    container_name: flash-sale-prometheus

    ports:
      - '9090:9090'

    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana
    container_name: flash-sale-grafana

    ports:
      - '3002:3000'

    volumes:
      - grafana:/var/lib/grafana

    depends_on:
      - prometheus

  blackbox-exporter:
    image: quay.io/prometheus/blackbox-exporter:latest
    container_name: flash-sale-blackbox-exporter

    ports:
      - '9115:9115'

    volumes:
      - ./blackbox/blackbox.yml:/config/blackbox.yml:ro

    command:
      - '--config.file=/config/blackbox.yml'

volumes:
  postgres:
  grafana:
