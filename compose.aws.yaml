services:
  postgresql:
    image: postgres:17
    container_name: postgresql
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - flash-sale-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8
    container_name: redis
    restart: unless-stopped
    networks:
      - flash-sale-network
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management
    container_name: rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - flash-sale-network
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: 704887592908.dkr.ecr.ap-northeast-2.amazonaws.com/flash-sale-api:step16
    container_name: flash-sale-api
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      RABBITMQ_URL: ${RABBITMQ_URL}
    ports:
      - '3000:3000'
    networks:
      - flash-sale-network
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  migrator:
    image: 704887592908.dkr.ecr.ap-northeast-2.amazonaws.com/flash-sale-api:migrator
    container_name: flash-sale-migrator
    environment:
      DATABASE_URL: ${DATABASE_URL}
    networks:
      - flash-sale-network
    depends_on:
      postgresql:
        condition: service_healthy
    profiles:
      - migration

volumes:
  postgres-data:
    external: true
    name: postgres-data

  rabbitmq-data:
    external: true
    name: rabbitmq-data

networks:
  flash-sale-network:
    external: true
    name: flash-sale-network
